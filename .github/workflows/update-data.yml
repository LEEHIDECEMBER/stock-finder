name: 주식 데이터 업데이트

on:
  schedule:
    # 한국 시간 화~토 오전 6:17 (UTC 월~금 21:17)
    # → 전날 국내 장 마감 + 밤사이 미국 장 마감 데이터를 한 번에 받는다
    - cron: '17 21 * * 1-5'
  workflow_dispatch: # Actions 탭에서 [Run workflow] 버튼으로 바로 실행

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 라이브러리 설치
        run: pip install -r requirements.txt

      - name: 데이터 수집
        run: python scripts/fetch_data.py

      - name: data.json 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "바뀐 데이터 없음"
          else
            git commit -m "data: $(TZ=Asia/Seoul date +%F) 업데이트"
            git push
          fi
