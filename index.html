<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4F5F9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="선호주식">
<title>선호 주식 찾기</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>
  // 화면이 깜빡이지 않게 그리기 전에 테마부터 적용 (기본: 화이트)
  (function(){ var t='light'; try{ t = JSON.parse(localStorage.getItem('sf.theme')) || 'light'; }catch(e){}
    document.documentElement.dataset.theme = t;
    document.querySelector('meta[name=theme-color]').content = t==='dark' ? '#15142A' : '#F4F5F9'; })();
</script>
<style>
:root{ /* 화이트 모드 (기본) */
  --bg:#F4F5F9;--card:#FFFFFF;--card2:#EEF0F6;--line:#E2E5EE;
  --text:#16172B;--sub:#4A4D66;--mute:#8A8DA6;
  --accent:#2F7FD8;--accent2:#C9780E;--up:#E5383B;--down:#2D6BDB;--kosdaq:#7254D9;
  --accent-soft:rgba(47,127,216,.10);--accent-line:rgba(47,127,216,.40);
  --accent2-soft:rgba(232,150,40,.12);--accent2-line:rgba(201,120,14,.40);--kosdaq-soft:rgba(114,84,217,.10);
  --on-accent:#FFFFFF;--nav-bg:rgba(255,255,255,.94);--toast-bg:#16172B;--toast-fg:#FFFFFF;--dim:rgba(20,22,40,.35);
  --shadow:0 1px 3px rgba(20,22,40,.06);
  --r:16px;
}
[data-theme="dark"]{
  --bg:#15142A;--card:#1E1D38;--card2:#27264A;--line:#33325A;
  --text:#FFFFFF;--sub:#B8B6D3;--mute:#8F8DB3;
  --accent:#8CCBF5;--accent2:#FFC56E;--up:#FF6B6B;--down:#5B9BFF;--kosdaq:#C3B4FF;
  --accent-soft:rgba(140,203,245,.16);--accent-line:rgba(140,203,245,.45);
  --accent2-soft:rgba(255,197,110,.12);--accent2-line:rgba(255,197,110,.40);--kosdaq-soft:rgba(180,160,255,.16);
  --on-accent:#15142A;--nav-bg:rgba(21,20,42,.94);--toast-bg:#FFFFFF;--toast-fg:#15142A;--dim:rgba(0,0,0,.55);
  --shadow:none;
}
html{color-scheme:light}
[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;
  font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 92px)}
header{display:flex;align-items:flex-end;justify-content:space-between;margin:4px 2px 14px}
header h1{font-size:24px;margin:0;font-weight:800;letter-spacing:-.5px}
.stamp{font-size:12px;color:var(--mute);text-align:right}
.banner{background:var(--accent2-soft);border:1px solid var(--accent2-line);color:var(--accent2);
  border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.sec-t{font-size:13px;color:var(--mute);margin:0 0 8px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.chips{display:flex;gap:8px;flex-wrap:wrap}
#periods{flex-wrap:nowrap;gap:6px}
#periods .chip{flex:1;padding:8px 0;text-align:center}
.chips.sm{gap:6px}
.chips.sm .chip{padding:7px 12px;font-size:13px}
.divider{height:1px;background:var(--line);margin:14px 0}
.picker{display:flex;align-items:center;justify-content:space-between;width:100%;background:var(--card2);border-radius:12px;padding:11px 14px;font-size:14px;font-weight:600;color:var(--sub);text-align:left}
.picker.on{background:var(--accent-soft);color:var(--accent)}
.picker .arrow{font-size:20px;line-height:1;color:var(--mute)}
.btn-sm{flex:0 0 auto;padding:8px 14px;border-radius:10px;font-size:13px;font-weight:700;background:var(--card2);color:var(--sub)}
.btn-sm.primary{background:var(--accent);color:var(--on-accent)}
.btn-sm.warn{color:var(--up)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{font-size:12px;font-weight:600;color:var(--sub);background:var(--card2);border-radius:8px;padding:3px 8px}
.grid div:last-child:nth-child(odd){grid-column:span 2}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{padding:8px 14px;border-radius:999px;background:var(--card2);color:var(--sub);font-size:14px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.chip.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.chip.preset{background:transparent;border:1px solid var(--line);color:var(--sub)}
.chip.preset.mine{border-color:var(--accent2-line);color:var(--accent2)}
.cond{border-top:1px solid var(--line);padding:12px 0 2px}
.cond:first-child{border-top:0;padding-top:2px}
.cond-h{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.cond-name{font-weight:700}
.sig{font-size:11px;font-weight:800;color:var(--on-accent);background:var(--accent2);border-radius:6px;padding:1px 6px}
.cond-unit{font-size:12px;color:var(--mute)}
.cond-x{margin-left:auto;width:30px;height:30px;border-radius:10px;background:var(--card2);color:var(--mute);font-size:18px;line-height:30px}
.cond-r{display:flex;align-items:center;gap:8px}
.cond-r span{color:var(--mute)}
.num{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px;outline:none}
.num:focus{border-color:var(--accent)}
.hint{font-size:13px;color:var(--mute);margin-top:6px;line-height:1.55;white-space:pre-line;word-break:keep-all}
.btn-row{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;padding:12px;border-radius:12px;background:var(--card2);font-weight:700;font-size:14px;color:var(--sub)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.warn{color:var(--up)}
.empty{color:var(--mute);font-size:14px;text-align:center;padding:14px 0}
.res-h{display:flex;align-items:center;gap:8px;margin:18px 2px 10px}
.res-h b{font-size:18px}
.res-h .sp{flex:1}
select.sort{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:13px;color:var(--sub);outline:none}
.dirbtn{background:var(--card);border:1px solid var(--line);border-radius:10px;width:34px;height:33px;color:var(--sub)}
.search{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:15px;outline:none;margin-bottom:10px}
.stock{display:flex;align-items:center;gap:12px;background:var(--card);box-shadow:var(--shadow);border-radius:14px;padding:13px 14px;margin-bottom:8px;width:100%;text-align:left}
.stock .l{flex:1;min-width:0}
.stock .nm{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stock .meta{font-size:12px;color:var(--mute);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stock .r{text-align:right;flex-shrink:0}
.stock .pr{font-weight:600;font-size:14px;color:var(--sub)}
.stock .rt{font-weight:800;font-size:16px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;margin-right:4px;vertical-align:1px}
.b-KOSPI{background:var(--accent-soft);color:var(--accent)}
.b-KOSDAQ{background:var(--kosdaq-soft);color:var(--kosdaq)}
.b-SP500{background:var(--accent2-soft);color:var(--accent2)}
.star{color:var(--accent2)}
.up{color:var(--up)}.down{color:var(--down)}
.more{width:100%;padding:13px;border-radius:12px;background:var(--card);color:var(--sub);font-weight:700;margin-top:4px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--nav-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 0 calc(env(safe-area-inset-bottom) + 6px);z-index:20}
nav.tabs .in{display:flex;max-width:560px;width:100%}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--mute);font-size:11px;font-weight:600}
nav.tabs button.on{color:var(--accent)}
nav.tabs svg{width:24px;height:24px}
.view{display:none}.view.on{display:block}
/* sheet */
.dim{position:fixed;inset:0;background:var(--dim);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.dim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;background:var(--card);border-radius:22px 22px 0 0;
  padding:10px 18px calc(env(safe-area-inset-bottom) + 18px);max-height:88vh;overflow-y:auto;transform:translateY(105%);transition:transform .25s ease}
.sheet.on{transform:none}
.sheet-x{position:absolute;right:14px;top:12px;width:34px;height:34px;border-radius:12px;background:var(--card2);color:var(--sub);font-size:20px;line-height:34px}
.sheet h2{padding-right:40px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h2{font-size:21px;margin:0 0 2px;letter-spacing:-.3px}
.sheet .sub{color:var(--mute);font-size:13px}
.big{font-size:28px;font-weight:800;margin:12px 0 4px}
.rets{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin:12px 0}
.rets div{background:var(--card2);border-radius:10px;padding:8px 2px;text-align:center}
.rets small{display:block;color:var(--mute);font-size:11px}
.rets b{font-size:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.grid div{background:var(--card2);border-radius:12px;padding:10px 12px}
.grid small{display:block;color:var(--mute);font-size:12px}
.grid b{font-size:16px}
.metric-item{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;padding:13px 2px;border-bottom:1px solid var(--line)}
.metric-item{gap:14px}
.metric-item small{display:block;color:var(--mute);font-size:13px;margin-top:4px;line-height:1.55;white-space:pre-line;word-break:keep-all}
.metric-item .plus{width:30px;height:30px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-size:20px;line-height:30px;text-align:center;flex-shrink:0}
.field{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px;outline:none;margin-top:8px}
textarea.field{min-height:70px;resize:vertical}
.preset-item{display:flex;align-items:center;gap:12px;background:var(--card);box-shadow:var(--shadow);border-radius:14px;padding:14px;margin-bottom:8px}
.pi-l{flex:1;min-width:0}
.pi-r{display:flex;flex-direction:column;gap:6px}
.preset-item .t{font-weight:700;font-size:16px}
.preset-item .s{color:var(--mute);font-size:13px;margin-top:3px}
.row{display:flex;justify-content:space-between;padding:7px 0;font-size:14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row span:first-child{color:var(--mute)}
.note{font-size:12px;color:var(--mute);line-height:1.6}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--toast-bg);color:var(--toast-fg);padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;z-index:60;transition:.2s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%)}
a.link{display:block;text-align:center;padding:12px;border-radius:12px;background:var(--card2);color:var(--accent);font-weight:700;text-decoration:none;margin-top:8px}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 id="title">선호 주식 찾기</h1>
    <div class="stamp" id="stamp">불러오는 중…</div>
  </header>
  <div id="banner"></div>

  <!-- 찾기 -->
  <section class="view on" id="v-find">
    <div class="card">
      <div class="sec-t">시장</div>
      <div class="chips" id="markets"></div>
      <div class="divider"></div>
      <div class="sec-t">관심 분야</div>
      <button class="picker" data-act="pickTheme"><span id="themeSum"></span><span class="arrow">›</span></button>
      <div class="divider"></div>
      <div class="sec-t">상승률 기간</div>
      <div class="chips" id="periods"></div>
    </div>
    <div class="sec-t" style="margin:4px 2px 8px">예시·저장한 조건</div>
    <div class="chips scroll" id="presetChips" style="margin-bottom:12px"></div>
    <div class="card">
      <div class="sec-t">조건 <span id="condCount"></span></div>
      <div id="conds"></div>
      <div class="btn-row">
        <button class="btn primary" data-act="addCond">＋ 조건 추가</button>
        <button class="btn" data-act="savePreset">조건 저장</button>
        <button class="btn" data-act="clearConds" style="flex:.6">초기화</button>
      </div>
    </div>
    <div class="res-h">
      <b id="resCount">0개</b><span class="sp"></span>
      <select class="sort" id="sortSel"></select>
      <button class="dirbtn" id="dirBtn" aria-label="정렬 방향">↓</button>
    </div>
    <input class="search" id="q" type="search" placeholder="종목명·코드 검색" autocomplete="off">
    <div id="results"></div>
  </section>

  <!-- 관심 -->
  <section class="view" id="v-watch">
    <div id="watchList"></div>
  </section>

  <!-- 조건 -->
  <section class="view" id="v-presets">
    <div id="presetList"></div>
  </section>

  <!-- 설정 -->
  <section class="view" id="v-settings">
    <div class="card"><div class="sec-t">화면 모드</div><div class="chips" id="themeChips"></div></div>
    <div class="card"><div class="sec-t">데이터</div><div id="dataInfo"></div></div>
    <div class="card"><div class="sec-t">계정 동기화</div><div id="account"></div></div>
    <div class="card">
      <div class="sec-t">백업</div>
      <div class="btn-row" style="margin-top:0">
        <button class="btn" data-act="export">백업 파일 저장</button>
        <button class="btn" data-act="import">불러오기</button>
      </div>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
    <div class="card note">
      이 앱은 조건에 맞는 종목을 걸러 주는 도구예요. 데이터는 무료 공개 소스에서 하루 한 번 받아 오기 때문에 늦거나 틀릴 수 있어요.
      특정 종목을 추천하는 게 아니며, 투자 판단과 책임은 본인에게 있어요.
    </div>
  </section>
</div>

<nav class="tabs"><div class="in">
  <button data-tab="find" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>찾기</button>
  <button data-tab="watch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>관심</button>
  <button data-tab="presets"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>조건</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>설정</button>
</div></nav>

<div class="dim" id="dim"></div>
<div class="sheet" id="sheet"></div>

const nf = (v,d=0) => v==null ? '-' : Number(v).toLocaleString('ko-KR',{minimumFractionDigits:d, maximumFractionDigits:d});
function krw(v){ if(v==null) return '-'; if(v>=1e12) return nf(v/1e12, v>=1e14?0:1)+'조'; if(v>=1e8) return nf(Math.round(v/1e8))+'억'; return nf(Math.round(v/1e4))+'만'; }
function vol(v){ if(v==null) return '-'; if(v>=1e8) return nf(v/1e8,1)+'억주'; if(v>=1e4) return nf(Math.round(v/1e4))+'만주'; return nf(v)+'주'; }
function skrw(v){ if(v==null) return '-'; return (v>0?'+':v<0?'-':'')+krw(Math.abs(v)); }
const price = s => s.p==null ? '-' : (s.m==='SP500' ? '$'+nf(s.p,2) : nf(s.p)+'원');
const pct = v => v==null ? '-' : (v>0?'+':'')+nf(v,1)+'%';
const upd = v => v==null ? '' : v>0 ? 'up' : v<0 ? 'down' : '';
const today = () => new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
const uid = () => Math.random().toString(36).slice(2,10);
const clone = o => JSON.parse(JSON.stringify(o));
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1600); }
function metricText(s,k){
  const m = MET[k];
  if (m && m.flag) return (s.fl & m.flag) ? '예' : '-';
  const v = k==='ret' ? s[F.period] : s[k];
  if (v==null) return '-';
  switch (k){
    case 'ret': case 'd20': case 'l52': case 'h52': return pct(v);
    case 'mc': case 'val': return krw(v);
    case 'fb': case 'ib': return skrw(v);
    case 'vol': return vol(v);
    case 'vr': return nf(v,1)+'배';
    case 'rsi': return nf(v,0);
    case 'div': return v===0 ? '없음' : nf(v,2)+'%';
    case 'roe': return nf(v,1)+'%';
    default: return nf(v,2)+'배';
  }
}
const condLabel = k => k==='ret' ? PK[F.period]+' 상승률' : MET[k].label;
function condSummary(p){
  const per = p.period || 'r3m';
  const parts = Object.entries(p.conds||{}).map(([k,c])=>{
    const m = MET[k]; if(!m) return '';
    if (m.flag) return m.label;
    const name = k==='ret' ? PK[per]+' 상승률' : m.label;
    const u = m.unit==='억원' ? '' : m.unit;
    const nb = v => m.unit==='억원'
      ? (Math.abs(v)>=10000 ? Number(v/10000).toLocaleString('ko-KR',{maximumFractionDigits:1})+'조원' : Number(v).toLocaleString('ko-KR')+'억원')
      : Number(v).toLocaleString('ko-KR',{maximumFractionDigits:2});
    if (c.min!=null && c.max!=null) return `${name} ${nb(c.min)}~${nb(c.max)}${u}`;
    if (c.min!=null) return `${name} ${nb(c.min)}${u} 이상`;
    if (c.max!=null) return `${name} ${nb(c.max)}${u} 이하`;
    return name;
  }).filter(Boolean);
  const th = (p.themes||[]).map(id => (themeList().find(x=>x[0]===id)||[,id])[1]);
  if (th.length) parts.unshift(th.join('·'));
  return parts.join(' · ') || '조건 없음';
}

/* ===== 데이터 ===== */
async function loadData(){
  let raw = null, sample = false;
  try{
    const r = await fetch('data.json?t='+Date.now(), {cache:'no-store'});
    if(!r.ok) throw new Error(r.status);
    raw = await r.json();
    if(!raw.rows || !raw.rows.length) throw new Error('empty');
  }catch(e){
    raw = JSON.parse($('#sample-data').textContent.replace(/\/\*SAMPLE_(START|END)\*\//g, ''));
    sample = true;
  }
  const f = raw.fields;
  const list = raw.rows.map(r => { const o={}; f.forEach((k,i)=>o[k]=r[i]); return o; });
  DATA = {meta: Object.assign({}, raw.meta, sample?{sample:true}:{}), list, byT: new Map(list.map(s=>[s.t,s]))};
}

/* ===== 필터 ===== */
const themeList = () => DATA.meta.themes || [];
function themeMask(ids){ let m = 0; themeList().forEach(([id],i) => { if ((ids||[]).includes(id)) m |= (1<<i); }); return m; }
function themeNames(bits){ return themeList().filter((_,i) => bits & (1<<i)).map(([,l]) => l); }
function runFilter(){
  const q = F.q.trim().toLowerCase();
  const conds = Object.entries(F.conds);
  const mk = new Set(F.markets);
  const tm = themeMask(F.themes);
  const out = DATA.list.filter(s => {
    if (!mk.has(s.m)) return false;
    if (tm && !(s.th & tm)) return false;
    if (q && !(s.n.toLowerCase().includes(q) || s.t.toLowerCase().includes(q))) return false;
    for (const [k,c] of conds){
      const fm = MET[k];
      if (fm.flag){ if (!(s.fl & fm.flag)) return false; continue; }
      const v = k==='ret' ? s[F.period] : s[k];
      if (v==null) return false;
      const sc = MET[k].scale || 1;
      if (c.min!=null && v < c.min*sc) return false;
      if (c.max!=null && v > c.max*sc) return false;
    }
    return true;
  });
  const {k, dir} = F.sort;
  const key = k==='ret' ? F.period : k;
  out.sort((a,b) => {
    if (key==='n') return a.n.localeCompare(b.n,'ko') * (dir>0?1:-1);
    const x=a[key], y=b[key];
    if (x==null && y==null) return 0; if (x==null) return 1; if (y==null) return -1;
    return (x-y)*dir;
  });
  return out;
}

function applyPreset(id){

  if (!p) return;
  F.conds = clone(p.conds||{});
  if (p.period) F.period = p.period;
  if (p.markets) F.markets = [...p.markets];
  if (p.themes) F.themes = [...p.themes];
  if (p.sort) F.sort = {...p.sort};
  saveFilter(); renderFind(); switchTab('find'); toast(`'${p.name}' 적용`);
}

/* ===== 탭 ===== */
function switchTab(name){
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on', b.dataset.tab===name));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on', v.id==='v-'+name));
  const titles = {find:'선호 주식 찾기', watch:'관심종목', presets:'저장한 조건', settings:'설정'};
  $('#title').textContent = titles[name];
  window.scrollTo(0,0);
}

/* ===== 이벤트 ===== */
document.addEventListener('click', e => {
  const b = e.target.closest('button,[data-t]'); if(!b) return;
  const d = b.dataset;
  if (d.tab) return switchTab(d.tab);
  if (d.themeSet) return setTheme(d.themeSet);
  if (d.mk){
    const on = F.markets.includes(d.mk);
    if (on && F.markets.length===1) return toast('시장은 하나 이상 골라야 해요');
    F.markets = on ? F.markets.filter(x=>x!==d.mk) : [...F.markets, d.mk];
    saveFilter(); renderChips(); return renderResults();
  }
  if (d.th){
    if (d.th==='__all') F.themes = [];
    else F.themes = F.themes.includes(d.th) ? F.themes.filter(x=>x!==d.th) : [...F.themes, d.th];
    saveFilter(); renderChips(); return renderResults();
  }
  if (d.pd){ F.period = d.pd; saveFilter(); renderChips(); renderConds(); return renderResults(); }
  if (d.preset) return applyPreset(d.preset);
  if (d.apply) return applyPreset(d.apply);
  if (d.delpreset){
    const p = presets.find(x=>x.id===d.delpreset);
    if (p && confirm(`'${p.name}' 조건을 삭제할까요?`)){ presets = presets.filter(x=>x.id!==d.delpreset); saveUser(); renderPresets(); renderChips(); }
    return;
  }
  if (d.del){ delete F.conds[d.del]; saveFilter(); renderConds(); return renderResults(); }
  if (d.addk){ F.conds[d.addk] = MET[d.addk].flag ? {on:true} : {min:null,max:null}; saveFilter(); closeSheet(); renderConds(); renderResults();
    setTimeout(()=>$(`.cond[data-k="${d.addk}"] input`)?.focus(), 260); return; }
  if (d.star) return toggleStar(d.star);
  if (d.t) return openDetail(d.t);
  switch (d.act){
    case 'close': return closeSheet();
    case 'pickTheme':
      openSheet(`<h2>관심 분야</h2><div class="sub">여러 개 고르면 하나라도 해당되는 종목을 보여 줘요</div>
        <div class="chips" id="themes" style="margin:16px 0 4px"></div>
        <div class="btn-row"><button class="btn primary" data-act="close">완료</button></div>`);
      return renderChips();
    case 'addCond': return openAddCond();
    case 'savePreset': return openSavePreset();
    case 'clearConds': F.conds = {}; saveFilter(); renderConds(); return renderResults();
    case 'more': shown += PAGE; return renderResults(false);
    case 'doSave': {
      const name = ($('#pname').value||'').trim() || '내 조건 '+(presets.length+1);
      presets.unshift({id:uid(), name, markets:[...F.markets], themes:[...F.themes], period:F.period, conds:clone(F.conds), sort:{...F.sort}});
      saveUser(); closeSheet(); renderChips(); renderPresets(); return toast('조건을 저장했어요');
    }
    case 'export': return exportBackup();
    case 'import': return $('#importFile').click();
    case 'login': return doLogin();
    case 'logout': return fb && fb.A.signOut(fb.auth);
  }
});
$('#dim').addEventListener('click', closeSheet);
$('#conds').addEventListener('input', e => {
  const inp = e.target.closest('input'); if(!inp) return;
  const k = inp.closest('.cond').dataset.k;
  const raw = inp.value.replace(/,/g,'').trim();
  const v = raw==='' || raw==='-' ? null : Number(raw);
  if (raw!=='' && raw!=='-' && !isFinite(v)) return;
  F.conds[k][inp.dataset.b] = v;
  saveFilter(); renderResults();
});
$('#sortSel').addEventListener('change', e => {
  const k = e.target.value;
  F.sort = {k, dir: (k==='per'||k==='pbr'||k==='n'||k==='rsi') ? 1 : -1};
  saveFilter(); renderChips(); renderResults();
});
$('#dirBtn').addEventListener('click', () => { F.sort.dir *= -1; saveFilter(); renderChips(); renderResults(); });
let qTimer; $('#q').addEventListener('input', e => { clearTimeout(qTimer); qTimer = setTimeout(()=>{ F.q = e.target.value; renderResults(); }, 150); });

/* ===== 백업 ===== */
function exportBackup(){
  const blob = new Blob([JSON.stringify({app:'stock-finder', v:1, exportedAt:new Date().toISOString(), presets, watch, filter:F}, null, 2)], {type:'application/json'});
  const name = `선호주식_백업_${today()}.json`;
  const file = new File([blob], name, {type:'application/json'});
  if (navigator.canShare && navigator.canShare({files:[file]})) { navigator.share({files:[file]}).catch(()=>{}); return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
$('#importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; if(!f) return;
  try{
    const d = JSON.parse(await f.text());
    if (d.app!=='stock-finder') throw 0;
    if (!confirm('백업 파일로 저장한 조건과 관심종목을 덮어쓸까요?')) return;
    presets = d.presets||[]; watch = d.watch||[]; if (d.filter) F = Object.assign(defaultFilter(), d.filter, {q:''});
    saveFilter(); saveUser(); renderAll(); toast('불러왔어요');
  }catch(err){ toast('이 앱의 백업 파일이 아니에요'); }
  e.target.value = '';
});

/* ===== Firebase 동기화 ===== */
let fb = null, pushTimer = null;
async function initFirebase(){
  if (!FIREBASE_CONFIG) return;
  try{
    const base = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
    const [App, A, FS] = await Promise.all([import(base+'firebase-app.js'), import(base+'firebase-auth.js'), import(base+'firebase-firestore.js')]);
    const app = App.initializeApp(FIREBASE_CONFIG);
    const auth = A.getAuth(app);
    const db = FS.initializeFirestore(app, {localCache: FS.persistentLocalCache()});
    fb = {A, FS, auth, db, user:null, unsub:null};
    A.onAuthStateChanged(auth, u => {
      fb.user = u;
      if (fb.unsub){ fb.unsub(); fb.unsub = null; }
      if (u) startSync();
      renderSettings();
    });
  }catch(e){ console.warn('firebase', e); $('#account').innerHTML = `<div class="note">Firebase 연결에 실패했어요. 인터넷 연결과 설정을 확인해 주세요.</div>`; }
}
function userRef(){ return fb.FS.doc(fb.db, 'users', fb.user.uid); }
const mergeBy = (a, b, key) => { const m = new Map(); [...b, ...a].forEach(x => m.set(x[key], x)); return [...m.values()]; };
function startSync(){
  let first = true;
  fb.unsub = fb.FS.onSnapshot(userRef(), snap => {
    if (snap.metadata.hasPendingWrites) return;
    const d = snap.data();
    if (first){
      first = false;
      if (d){ presets = mergeBy(presets, d.presets||[], 'id'); watch = mergeBy(watch, d.watch||[], 't'); }
      saveUser(false); cloudPush(true); renderAll(); return;
    }
    if (d){ presets = d.presets||[]; watch = d.watch||[]; saveUser(false); renderChips(); renderWatch(); renderPresets(); renderResults(false); }
  }, err => console.warn('sync', err));
}
function cloudPush(now=false){
  if (!fb || !fb.user) return;
  clearTimeout(pushTimer);
  const go = () => fb.FS.setDoc(userRef(), {presets, watch, updatedAt: fb.FS.serverTimestamp()}).catch(e=>console.warn('push', e));
  now ? go() : (pushTimer = setTimeout(go, 400));
}
async function doLogin(){
  const em = $('#em').value.trim(), pw = $('#pw').value;
  const msg = $('#loginMsg');
  if (!em || !pw){ msg.textContent = '이메일과 비밀번호를 입력해 주세요'; return; }
  msg.textContent = '로그인 중…';
  try{ await fb.A.signInWithEmailAndPassword(fb.auth, em, pw); toast('로그인했어요'); }
  catch(e){ msg.textContent = '로그인 실패: 이메일 또는 비밀번호를 확인해 주세요'; }
}

/* ===== 시작 ===== */
(async function(){
  await loadData();
  renderAll();
  initFirebase();
  if ('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
